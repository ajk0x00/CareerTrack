services:
  # Opt-in local PostgreSQL container (for local development/testing)
  # Activated with: docker compose --profile db up
  db:
    profiles:
      - db
    image: postgres:16-alpine
    container_name: fastapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-careertrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-careertrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # FastAPI Service
  # Connects to externally managed PostgreSQL by default (configured via .env or environment)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-service:latest
    container_name: fastapi-service
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
